name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security problems, do not open an issue. See SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `sentrel-server version`
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options: [Docker, Linux package, Install script, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
