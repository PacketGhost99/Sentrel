name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish releases on tags
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web dependencies and build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - run: go vet ./...
      - run: go test ./...
      - name: Install msitools (MSI builder)
        run: sudo apt-get update && sudo apt-get install -y msitools wixl
      - name: Build release artifacts
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != tag ]; then VERSION="0.0.0-${GITHUB_SHA::8}"; fi
          scripts/build.sh --skip-web --version "$VERSION"
      - name: Sign checksums
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          HB_RELEASE_KEY: ${{ secrets.HB_RELEASE_KEY }}
        run: go run ./cmd/hb-sign sign -key env:HB_RELEASE_KEY dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes dist/*

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: heartbeat:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
