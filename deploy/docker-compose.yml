# Heartbeat server with Docker Compose.
#
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml logs heartbeat | grep "setup token"
#
# For Let's Encrypt (TLS mode "acme" in the setup wizard) publish 80 and 443
# instead of 8080, and pass --listen 0.0.0.0:443 in "command".
services:
  heartbeat:
    image: heartbeat:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: heartbeat
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - heartbeat-data:/data
    cap_add:
      - NET_RAW            # ICMP ping checks
    environment:
      - TZ=UTC

volumes:
  heartbeat-data:
