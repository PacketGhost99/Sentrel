name: cisco
description: Cisco IOS / IOS-XE / NX-OS (CISCO-PROCESS-MIB, CISCO-MEMORY-POOL-MIB, CISCO-ENVMON-MIB)
match:
  sys_object_id: ["1.3.6.1.4.1.9."]
  sys_descr: ["Cisco IOS", "Cisco NX-OS"]
metrics:
  - name: cpu_usage_percent
    oid: 1.3.6.1.4.1.9.9.109.1.1.1.1.7   # cpmCPUTotal1minRev
    aggregate: max
  - name: mem_used_percent
    expr: "used * 100 / (used + free)"
    vars:
      used: 1.3.6.1.4.1.9.9.48.1.1.1.5   # ciscoMemoryPoolUsed
      free: 1.3.6.1.4.1.9.9.48.1.1.1.6   # ciscoMemoryPoolFree
    filter:
      oid: 1.3.6.1.4.1.9.9.48.1.1.1.2    # ciscoMemoryPoolName
      regex: "(?i)processor"
    aggregate: max
  - name: temperature_celsius
    oid: 1.3.6.1.4.1.9.9.13.1.3.1.3      # ciscoEnvMonTemperatureStatusValue
    label_oid: 1.3.6.1.4.1.9.9.13.1.3.1.2
    label_name: sensor
