name: fortinet
description: Fortinet FortiGate (FORTINET-FORTIGATE-MIB)
match:
  sys_object_id: ["1.3.6.1.4.1.12356"]
  sys_descr: ["FortiGate"]
metrics:
  - name: cpu_usage_percent
    oid: 1.3.6.1.4.1.12356.101.4.1.3.0   # fgSysCpuUsage
  - name: mem_used_percent
    oid: 1.3.6.1.4.1.12356.101.4.1.4.0   # fgSysMemUsage
  - name: disk_used_percent
    expr: "cap > 0 ? used * 100 / cap : 0"
    vars:
      used: 1.3.6.1.4.1.12356.101.4.1.6.0  # fgSysDiskUsage (MB)
      cap: 1.3.6.1.4.1.12356.101.4.1.7.0   # fgSysDiskCapacity (MB)
  - name: firewall_sessions
    oid: 1.3.6.1.4.1.12356.101.4.1.8.0   # fgSysSesCount
  - name: vpn_tunnels_up
    expr: "s == 2 ? 1 : 0"
    vars:
      s: 1.3.6.1.4.1.12356.101.12.2.2.1.20  # fgVpnTunEntStatus (2=up)
    aggregate: sum
